# Security Configuration for VoiceAI

security:
  # Encryption settings
  encryption:
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
    # Keys should be managed via HashiCorp Vault or AWS KMS in production

  # JWT settings
  jwt:
    algorithm: "HS256"  # Use RS256 in production with key pairs
    access_token_ttl_minutes: 30
    refresh_token_ttl_days: 7
    issuer: "voiceai"
    audience: "voiceai-api"

  # Password policy
  password:
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special_chars: true
    max_age_days: 90
    history_count: 5
    bcrypt_rounds: 12

  # Session management
  session:
    idle_timeout_minutes: 30
    absolute_timeout_hours: 8
    concurrent_sessions_limit: 5
    secure_cookies: true
    same_site: "strict"

  # Rate limiting
  rate_limiting:
    api:
      requests_per_minute: 100
      burst: 20
    auth:
      requests_per_minute: 10
      burst: 5
    webhook:
      requests_per_minute: 50
      burst: 10

  # CORS policy
  cors:
    allowed_origins:
      - "https://app.voiceai.com"
      - "https://staging.voiceai.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Authorization"
      - "Content-Type"
      - "X-Requested-With"
    allow_credentials: true
    max_age: 86400

  # Security headers
  headers:
    content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: https:;"
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
    referrer_policy: "strict-origin-when-cross-origin"
    permissions_policy: "geolocation=(), microphone=(), camera=()"
    strict_transport_security: "max-age=31536000; includeSubDomains; preload"

  # API security
  api:
    versioning: "header"  # Accept-Version header
    deprecated_versions_sunset_days: 90
    request_validation: true
    response_validation: true
    max_request_size: "10MB"
    timeout_seconds: 30

  # Database security
  database:
    ssl_mode: "require"
    connection_encryption: true
    row_level_security: true
    audit_logging: true
    sensitive_columns_encrypted:
      - "password_hash"
      - "api_keys"
      - "tokens"
      - "pii_fields"

  # Audit logging
  audit:
    log_all_requests: true
    log_auth_events: true
    log_data_access: true
    log_admin_actions: true
    retention_days: 365
    immutable_storage: true

  # Compliance
  compliance:
    gdpr:
      enabled: true
      data_processing_agreement: true
      right_to_deletion: true
      data_portability: true
    trai_dnd:
      enabled: true
      registry_sync_interval_hours: 24
      calling_hours_enforcement: true
      consent_recording: true
    pci_dss:
      enabled: false  # Enable if processing payments

  # Monitoring & Alerting
  monitoring:
    failed_login_threshold: 5
    failed_login_window_minutes: 15
    suspicious_activity_alert: true
    anomaly_detection: true
    log_aggregation: "elasticsearch"
    alert_channels:
      - "slack"
      - "email"
      - "pagerduty"

  # Incident response
  incident_response:
    auto_block_ips: true
    block_duration_hours: 24
    notify_security_team: true
    forensic_log_retention_days: 90