# GitHub Actions CI/CD Pipeline

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: cd apps/web && npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/shared/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voiceai_test

      - name: Run frontend lint
        run: cd apps/web && npm run lint

      - name: Run frontend typecheck
        run: cd apps/web && npm run typecheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Run backend lint (ruff)
        run: |
          pip install ruff
          cd apps/api && ruff check --fix --unsafe-fixes . && ruff check .

      - name: Run backend typecheck (mypy)
        run: |
          pip install mypy
          cd apps/api && mypy app/

  # ============================================
  # Frontend Tests
  # ============================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd apps/web && npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/shared/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voiceai_test

      - name: Run tests
        run: cd apps/web && npm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/web/coverage/lcov.info
          flags: frontend

  # ============================================
  # Backend Tests
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: voiceai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Wait for services
        run: |
          sleep 5
          pg_isready -h localhost -p 5432 -U postgres
          redis-cli -h localhost ping

      - name: Run database migrations
        run: |
          cd apps/api
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/voiceai_test alembic upgrade head

      - name: Run tests
        run: |
          cd apps/api
          OPENAI_API_KEY=ci-test-key \
          PYTHONPATH="$GITHUB_WORKSPACE/apps/api" \
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/voiceai_test \
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage.xml
          flags: backend

  # ============================================
  # Integration Tests
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          # Add integration test commands here

  # ============================================
  # Build Docker Images
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-frontend, test-backend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add staging deployment commands
          # Example: kubectl apply -f k8s/staging/

  # ============================================
  # Deploy to Production (Docker Compose on VPS)
  # Required environment secrets:
  # VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_APP_PATH
  # Optional environment secret: VPS_SSH_PORT (defaults to 22)
  # ============================================
  deploy-production:
    name: Deploy to Production (VPS)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: voiceai-production-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY VPS_KNOWN_HOSTS VPS_APP_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production environment secret: $name"
              exit 1
            fi
          done
          if [[ "$VPS_APP_PATH" == "/" || ! "$VPS_APP_PATH" =~ ^/[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::VPS_APP_PATH must be a safe absolute path, e.g. /opt/voice-ai"
            exit 1
          fi
          if [[ -n "$VPS_SSH_PORT" && ! "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo "::error::VPS_SSH_PORT must be a valid numeric port"
            exit 1
          fi

      - name: Configure verified SSH access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" "mkdir -p '$VPS_APP_PATH'"

      - name: Sync application source to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='docker/ssl/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USERNAME@$VPS_HOST:$VPS_APP_PATH/"

      - name: Build, migrate, restart and verify production
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USERNAME@$VPS_HOST" \
            "bash -se -- '$VPS_APP_PATH' '$DEPLOY_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          APP_PATH="$1"
          DEPLOY_SHA="$2"
          cd "$APP_PATH"

          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on the VPS"; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose V2 is required on the VPS"; exit 1; }
          test -f .env || { echo "Missing $APP_PATH/.env. Create production environment configuration before deploying."; exit 1; }
          test -s docker/ssl/cert.pem || { echo "Missing $APP_PATH/docker/ssl/cert.pem. Install the production TLS certificate on the VPS."; exit 1; }
          test -s docker/ssl/key.pem || { echo "Missing $APP_PATH/docker/ssl/key.pem. Install the production TLS private key on the VPS."; exit 1; }

          echo "Deploying commit $DEPLOY_SHA"
          docker compose --profile production config --quiet
          docker compose --profile production up -d --build --remove-orphans

          echo "Applying database migrations"
          docker compose exec -T api alembic upgrade head

          echo "Checking API health"
          healthy=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T api curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose --profile production ps
            docker compose logs --tail=150 api web
            echo "Production health check failed"
            exit 1
          fi

          if ! docker compose exec -T nginx wget -qO- --no-check-certificate https://127.0.0.1/health >/dev/null; then
            docker compose --profile production ps
            docker compose logs --tail=150 nginx
            echo "Production HTTPS reverse-proxy health check failed"
            exit 1
          fi

          docker compose --profile production ps
          printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
          echo "Production deployment and API health check succeeded"
          REMOTE

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run dependency check (Safety)
        if: env.SAFETY_API_KEY != ''
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          pip install safety
          cd apps/api && safety scan --policy .safety-policy.yml -r requirements.txt

      - name: Run dependency check (Safety) - no API key
        if: env.SAFETY_API_KEY == ''
        run: |
          echo "SAFETY_API_KEY not set, skipping Safety scan"
          echo "To enable Safety scan, add SAFETY_API_KEY to repository secrets"
          exit 0

      - name: Run npm audit
        run: |
          cd apps/web && npm audit --audit-level=high || true